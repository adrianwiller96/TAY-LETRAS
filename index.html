span>${t.details?`<p>${esc(t.details)}</p>`:'<p class="muted">Sem descrição adicional.</p>'}<div class="toolbar">${btn('📅 Ver no calendário','jump:'+t.id)}${btn('Editar','edit:'+t.id)}${btn(t.done?'Reabrir':'Concluir','toggle:'+t.id)}${btn('Excluir','deleteTask:'+t.id)}</div></div></details>`}function home(){let pending=data.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due));let overdue=pending.filter(t=>daysLeft(t)<0).length;return `<h1>Meu painel acadêmico • Letras UFMS</h1><p class="muted">6º semestre • Organize suas disciplinas, leituras, trabalhos e avaliações.</p><div class="tay-hero"><img src="icons/lindinha-flores.jpg" alt="Lindinha com flores"><div><strong>Um semestre mais leve, com tudo no lugar 💙</strong><span>Organize suas leituras, avaliações e compromissos na UFMS.</span></div></div><div class="grid"><div class="panel"><div class="muted">Atividades pendentes</div><div class="stat">${pending.length}</div></div><div class="panel"><div class="muted">Prazos atrasados</div><div class="stat">${overdue}</div></div><div class="panel"><div class="muted">Disciplinas</div><div class="stat">${data.subjects.length}</div></div></div><div class="panel flex"><h2>Acesso rápido</h2><div class="toolbar">${btn('Nova atividade','newTask','primary')}${btn('Abrir calendário','openCalendar')}</div></div><section class="panel"><h2>Próximas atividades</h2>${pending.length?pending.slice(0,6).map(taskCard).join(''):'<p class="muted">Nenhuma atividade pendente. Cadastre uma disciplina e sua primeira atividade!</p>'}</section><section class="panel"><h2>Seu semestre</h2><p class="muted">Cadastre suas disciplinas e horários na UFMS. Calendário acadêmico oficial UFMS 2026 carregado. Feriados municipais específicos de cada campus devem ser conferidos separadamente.</p></section>`}
function calendar(){let first=new Date(year,month,1),length=new Date(year,month+1,0).getDate(),offset=first.getDay(),cells='';for(let i=0;i<offset;i++)cells+='<div class="day empty"></div>';for(let n=1;n<=length;n++){let date=iso(new Date(year,month,n)),official=eventosEm(date),exact=data.tasks.filter(t=>t.due===date),active=data.tasks.filter(t=>!t.done&&t.created<=date&&t.due>=date),upcoming=active.map(t=>diff(date,t.due));let c='';if(exact.some(t=>!t.done))c='due';else if(active.length){let v=Math.min(...upcoming);c=v<=3?'near':v<=7?'mid':'far'}if(mode==='prazo'&&!exact.length)c=upcoming.some(v=>v>=0&&v<=7)?(Math.min(...upcoming)<=3?'near':'mid'):'';if(exact.length&&exact.every(t=>t.done))c='done';if(official.length&&!c)c='official';cells+=`<button class="day ${c} ${selected===date?'selected':''}" data-date="${date}">${n}${official.length?'<span class="official-dot" title="Evento acadêmico"></span>':''}${exact.length?`<small>${exact.length} entrega(s)</small>`:''}${official.length?`<small class="official-label">${official.length} eventos</small>`:''}</button>`}let selectedTasks=data.tasks.filter(t=>t.due===selected),selectedEvents=eventosEm(selected);return `<div class="flex"><div><h1>Calendário inteligente</h1><p class="muted">Clique nas datas para consultar entregas.</p></div><div class="toolbar">${btn('‹','prevMonth')}<strong>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong>${btn('›','nextMonth')}</div></div><div class="panel"><div class="toolbar"><label>Modo de cores <select id="mode"><option value="ambos" ${mode==='ambos'?'selected':''}>Sequência completa + alertas</option><option value="prazo" ${mode==='prazo'?'selected':''}>Somente alertas próximos</option></select></label></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="legend"><span><i class="swatch far"></i>Distante</span><span><i class="swatch mid"></i>Até 7 dias</span><span><i class="swatch near"></i>Até 3 dias</span><span><i class="swatch due"></i>Entrega</span></div><p class="muted">Se houver atividades sobrepostas, aparece a cor do prazo mais próximo. A sequência começa na data de cadastro.</p></div><div class="panel"><div class="flex"><h2>${format(selected)} — entregas</h2>${btn('Adicionar atividade nesta data','addOnDate','primary')}</div>${selectedTasks.length?selectedTasks.map(taskCard).join(''):'<p class="muted">Nenhuma entrega nesta data.</p>'}</div>`}function tasks(){let t=editTask?data.tasks.find(x=>x.id===editTask):null;return `<h1>Atividades e provas</h1><div class="panel"><h2>${t?'Editar atividade':'Nova atividade'}</h2><form id="taskForm"><label>Título<input name="title" required maxlength="120" value="${esc(t?.title||'')}"></label><label>Tipo<select name="type">${['Trabalho','Prova','Atividade','Seminário','Outro'].map(v=>`<option ${t?.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Disciplina<select name="subject"><option value="">Sem disciplina</option>${opt(data.subjects,t?.subject)}</select></label><label>Data de entrega<input type="date" name="due" required value="${t?.due||selected||today()}"></label><label class="wide">Descrição<textarea name="details">${esc(t?.details||'')}</textarea></label><div class="toolbar">${btn(t?'Salvar alterações':'Cadastrar atividade','submitTask','primary')}${t?btn('Cancelar edição','cancelEdit'):''}</div></form></div><div class="panel"><h2>Atividades cadastradas</h2>${data.tasks.length?data.tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(taskCard).join(''):'<p class="muted">Nenhuma atividade cadastrada.</p>'}</div>`}function subjects(){return `<h1>Disciplinas</h1><div class="panel"><h2>Cadastrar disciplina</h2><form id="subjectForm"><label>Nome<input name="name" required maxlength="100" placeholder="Ex.: Literatura Brasileira"></label><label>Carga horária total (aulas)<input name="hours" type="number" min="1" step="1" value="60" required></label><label>Frequência mínima (%)<input name="min" type="number" min="1" max="100" step="1" value="75" required></label><div>${btn('Adicionar disciplina','submitSubject','primary')}</div></form></div><div class="panel"><h2>Minhas disciplinas</h2>${data.subjects.length?data.subjects.map(s=>`<div class="item flex"><span><strong>${esc(s.name)}</strong> ${s.code?`<span class="muted">(${esc(s.code)})</span>`:""}<br><span class="muted">${s.hours} aulas • ${s.trackAttendance===false?"controle de faltas desativado":"frequência mínima "+s.min+"%"}</span></span>${btn('Excluir','deleteSubject:'+s.id)}</div>`).join(''):'<p class="muted">Cadastre as disciplinas do seu 6º semestre.</p>'}</div>`}function grades(){let rows=data.subjects.map(s=>{let g=data.grades.filter(x=>x.subject===s.id),sum=g.reduce((a,x)=>a+x.value*x.weight,0),weight=g.reduce((a,x)=>a+x.weight,0),avg=weight?(sum/weight).toFixed(2).replace('.',','):'—';return `<div class="item"><strong>${esc(s.name)}</strong> • Média das avaliações lançadas: <strong>${avg}</strong><p class="muted">A média usa os pesos cadastrados; não é uma projeção automática da nota final.</p>${g.length?`<table><tr><th>Avaliação</th><th>Nota</th><th>Peso</th><th></th></tr>${g.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.value}</td><td>${x.weight}</td><td>${btn('Excluir','deleteGrade:'+x.id)}</td></tr>`).join('')}</table>`:''}</div>`}).join('');return `<h1>Controle de notas</h1><div class="panel"><h2>Registrar avaliação</h2><form id="gradeForm"><label>Disciplina<select name="subject" required>${opt(data.subjects)}</select></label><label>Avaliação<input name="title" required placeholder="Ex.: Prova 1"></label><label>Nota (0 a 10)<input type="number" name="value" min="0" max="10" step="0.01" required></label><label>Peso<input type="number" name="weight" min="0.01" step="0.01" value="1" required></label><div>${btn('Registrar nota','submitGrade','primary')}</div></form></div><div class="panel"><h2>Resumo por disciplina</h2>${rows||'<p class="muted">Cadastre uma disciplina primeiro.</p>'}</div>`}function schedule(){const dias=['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];return `<h1>Grade semanal • Letras UFMS</h1><div class="panel"><h2>Cadastrar horário</h2><form id="scheduleForm"><label>Disciplina<select name="subject" required>${opt(data.subjects)}</select></label><label>Dia da semana<select name="day" required>${dias.slice(1).map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select></label><label>Início<input name="start" type="time" required></label><label>Término<input name="end" type="time" required></label><label>Sala / local<input name="room" placeholder="Ex.: Bloco 2, sala 5" maxlength="100"></label><div>${btn('Adicionar horário','submitSchedule','primary')}</div></form></div>${dias.slice(1).map((dia,i)=>{let entries=data.schedule.filter(x=>Number(x.day)===i+1).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="panel"><h2>${dia}</h2>${entries.length?entries.map(x=>`<div class="item flex"><span><strong>${esc(name(x.subject))}</strong><br><span class="muted">${esc(x.start)}–${esc(x.end)}${x.room?' • '+esc(x.room):''}</span></span>${btn('Excluir','deleteSchedule:'+x.id)}</div>`).join(''):'<p class="muted">Sem aulas cadastradas</p>'}</div>`}).join('')}`}
function attendance(){let rows=data.subjects.filter(s=>s.trackAttendance!==false).map(s=>{let records=data.attendance.filter(a=>a.subject===s.id),abs=records.reduce((n,a)=>n+a.missed,0),held=records.reduce((n,a)=>n+a.held,0),pct=held?((held-abs)/held*100):100,max=Math.floor(s.hours*(1-s.min/100)+1e-9),left=max-abs;return `<div class="item"><strong>${esc(s.name)}</strong><p>Frequência registrada: <strong>${pct.toFixed(1)}%</strong> (${held-abs} presenças em ${held} aulas registradas)</p><progress max="100" value="${pct}"></progress><p class="muted">Faltas acumuladas: ${abs} • Limite estimado para ${s.hours} aulas: ${max} • Saldo: ${left}</p><p class="muted">A frequência acima considera somente as aulas registradas. O limite usa a carga horária total informada; confira as regras da instituição.</p>${records.map(a=>`<div class="flex"><span>${format(a.date)}: ${a.missed} falta(s) em ${a.held} aula(s)</span>${btn('Excluir','deleteAttendance:'+a.id)}</div>`).join('')}</div>`}).join('');return `<h1>Controle de faltas</h1><div class="panel"><h2>Registrar aulas e faltas</h2><form id="attendanceForm"><label>Disciplina<select name="subject" required>${opt(data.subjects.filter(s=>s.trackAttendance!==false))}</select></label><label>Data<input type="date" name="date" value="${today()}" required></label><label>Aulas realizadas<input type="number" name="held" min="1" step="1" value="2" required></label><label>Faltas nessas aulas<input type="number" name="missed" min="0" step="1" value="0" required></label><div>${btn('Registrar frequência','submitAttendance','primary')}</div></form></div><div class="panel"><h2>Resumo de frequência</h2>${rows||'<p class="muted">Cadastre uma disciplina primeiro.</p>'}</div>`}function backup(){return `<h1>Backup e privacidade</h1><div class="panel"><h2>Seus dados são locais</h2><p>As informações ficam no armazenamento deste navegador e não são enviadas a servidores por este aplicativo. Limpar os dados do navegador pode apagar seus registros.</p><div class="toolbar">${btn('Exportar backup JSON','export','primary')}<label>Restaurar backup<input type="file" id="restore" accept=".json,application/json"></label></div><p class="muted">Restaure somente backups deste aplicativo. Restaurar substitui todos os dados atuais. Guarde o backup em um local seguro.</p></div>`}function goto(p){page=p;editTask=null;render()}document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){goto(p.dataset.page);return}let d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;render();return}let b=e.target.closest('[data-action]');if(!b)return;let [action,id]=b.dataset.action.split(':');if(action==='openCalendar')goto('calendario');if(action==='newTask'){selected=today();goto('atividades')}if(action==='addOnDate')goto('atividades');if(action==='prevMonth'||action==='nextMonth'){let n=new Date(year,month+(action==='nextMonth'?1:-1),1);year=n.getFullYear();month=n.getMonth();render()}if(action==='jump'){let t=data.tasks.find(x=>x.id===id);if(t)jump(t)}if(action==='edit'){editTask=id;page='atividades';render();scrollTo(0,0)}if(action==='cancelEdit'){editTask=null;render()}if(action==='toggle'){let t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}if(action==='deleteTask'&&confirm('Excluir esta atividade?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}if(action==='deleteSchedule'&&confirm('Excluir este horário?')){data.schedule=data.schedule.filter(x=>x.id!==id);save();render()}if(action==='deleteGrade'&&confirm('Excluir esta nota?')){data.grades=data.grades.filter(x=>x.id!==id);save();render()}if(action==='deleteAttendance'&&confirm('Excluir este registro?')){data.attendance=data.attendance.filter(x=>x.id!==id);save();render()}if(action==='deleteSubject'&&confirm('Excluir disciplina e suas notas, faltas e vínculos de atividades?')){data.subjects=data.subjects.filter(x=>x.id!==id);data.schedule=data.schedule.filter(x=>x.subject!==id);data.grades=data.grades.filter(x=>x.subject!==id);data.attendance=data.attendance.filter(x=>x.subject!==id);data.tasks.forEach(x=>{if(x.subject===id)x.subject=''});save();render()}if(action==='submitTask')document.getElementById('taskForm').requestSubmit();if(action==='submitSubject')document.getElementById('subjectForm').requestSubmit();if(action==='submitGrade')document.getElementById('gradeForm').requestSubmit();if(action==='submitAttendance')document.getElementById('attendanceForm').requestSubmit();if(action==='export'){let blob=new Blob([JSON.stringify({app:"letras-ufms",version:1,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='letras-ufms-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});document.addEventListener('change',async e=>{if(e.target.id==='mode'){mode=e.target.value;render()}if(e.target.id==='restore'){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='letras-ufms')throw Error('Este backup não pertence ao aplicativo Letras UFMS');if(!['subjects','tasks','grades','attendance'].every(k=>Array.isArray(x[k])))throw Error('Estrutura inválida');if(!confirm('Substituir todos os dados atuais pelo backup?'))return;data={subjects:x.subjects,tasks:x.tasks,grades:x.grades,attendance:x.attendance,schedule:Array.isArray(x.schedule)?x.schedule:[]};save();goto('inicio');alert('Backup restaurado!')}catch(err){alert('Não foi possível restaurar: '+err.message)}}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='taskForm'){if(editTask){Object.assign(data.tasks.find(x=>x.id===editTask),{title:v.title.trim(),type:v.type,subject:v.subject,due:v.due,details:v.details})}else data.tasks.push({id:uid(),title:v.title.trim(),type:v.type,subject:v.subject,due:v.due,details:v.details,created:today(),done:false});editTask=null}if(f.id==='scheduleForm'){if(!v.subject)return alert('Cadastre uma disciplina antes.');if(v.end<=v.start)return alert('O horário de término deve ser posterior ao início.');data.schedule.push({id:uid(),subject:v.subject,day:Number(v.day),start:v.start,end:v.end,room:v.room.trim()})}if(f.id==='subjectForm')data.subjects.push({id:uid(),name:v.name.trim(),hours:Number(v.hours),min:Number(v.min)});if(f.id==='gradeForm'){if(!v.subject)return alert('Cadastre uma disciplina antes.');data.grades.push({id:uid(),subject:v.subject,title:v.title.trim(),value:Number(v.value),weight:Number(v.weight)})}if(f.id==='attendanceForm'){if(!v.subject)return alert('Cadastre uma disciplina antes.');if(subject(v.subject)?.trackAttendance===false)return alert('Controle de faltas desativado para esta disciplina.');if(Number(v.missed)>Number(v.held))return alert('As faltas não podem superar as aulas realizadas.');data.attendance.push({id:uid(),subject:v.subject,date:v.date,held:Number(v.held),missed:Number(v.missed)})}save();render()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(console.warn);render();
</script></body></html>
